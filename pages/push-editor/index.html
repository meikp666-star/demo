<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>推送可视化编辑器 v2</title>
<style>
  :root{--g:#07c160;--bd:#e3e5e8;--bg:#f2f3f5;--tx:#1f2329;--sub:#8a9099;--warn:#ff9f1a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
  button,select,input,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  header{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--bd)}
  header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
  .sp{flex:1}
  .btn{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--g);color:var(--g)}
  .btn.pri{background:var(--g);border-color:var(--g);color:#fff}
  .btn.pri:hover{color:#fff;filter:brightness(1.05)}
  .btn.danger:hover{border-color:#e54545;color:#e54545}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .modes{display:inline-flex;border:1px solid var(--g);border-radius:8px;overflow:hidden}
  .modes button{border:0;background:#fff;padding:5px 12px;cursor:pointer;color:var(--g)}
  .modes button.on{background:var(--g);color:#fff}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;background:#fff;padding:3px 9px;cursor:pointer;font-size:12px}
  .seg button+button{border-left:1px solid var(--bd)}
  .seg button.on{background:var(--g);color:#fff}
  main{display:flex;height:calc(100% - 48px - 26px)}
  .center{flex:none;width:440px;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--bd)}
  .center.full{flex:1;width:auto}
  .stagebar{min-height:38px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px 10px;background:#fff;border-bottom:1px solid var(--bd)}
  #hint{color:var(--sub);font-size:12px;line-height:1.5}
  #hov{position:absolute;display:none;pointer-events:none;border:1px dashed #1989fa;background:rgba(25,137,250,.08);z-index:4}
  #hint b{color:var(--g)}
  #stageWrap{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;background:#e9ebee;min-height:0}
  #stage{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:4px;height:max-content;flex:none;max-width:100%}
  #frame{width:100%;border:0;display:block;min-height:560px}
  #ov{position:absolute;display:none;pointer-events:none;border:2px solid var(--g);background:rgba(7,193,96,.08);z-index:5;border-radius:3px}
  #ov::after{content:attr(data-tag);position:absolute;left:-2px;top:-20px;background:var(--g);color:#fff;font-size:11px;padding:0 5px;border-radius:3px 3px 0 0;white-space:nowrap}
  #drawer{height:150px;border-top:1px solid var(--bd);background:#1e1f22}
  #drawer textarea{width:100%;height:100%;border:0;outline:0;resize:none;padding:8px 10px;font:12px/18px Consolas,monospace;background:#1e1f22;color:#d6d6d6;white-space:pre;tab-size:2}
  .side{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.15fr);background:#fff}
  .center.full+.side{flex:none;width:640px}
  .col{display:flex;flex-direction:column;min-width:0;min-height:0}
  .col+.col{border-left:1px solid var(--bd)}
  .colh{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--bd);font-weight:600;color:var(--tx)}
  .colh .sp{flex:1}
  .colh button{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:1px 7px;cursor:pointer;font-size:12px;font-weight:400}
  .colh button:hover{border-color:var(--g);color:var(--g)}
  #panel,#tree{flex:1;overflow:auto;min-height:0}
  .card{padding:10px 12px;border-bottom:1px solid var(--bd)}
  .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:6px}
  .crumb i{color:#bbb;font-style:normal}
  .crumb .lbl{color:var(--sub);font-size:12px;margin-right:2px;cursor:default;background:none;padding:0}
  .crumb span{padding:0 6px;border-radius:4px;background:var(--bg);font:12px Consolas,monospace;cursor:pointer}
  .crumb span:not(.lbl):hover{outline:1px solid var(--g)}
  .crumb span.cur{background:var(--g);color:#fff}
  .crumb.kids span em{font:11px sans-serif;color:var(--sub);font-style:normal}
  .tools{display:flex;flex-wrap:wrap;gap:5px}
  .tools button{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px}
  .tools button:hover{border-color:var(--g);color:var(--g)}
  .tools button.danger:hover{border-color:#e54545;color:#e54545}
  .note{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.6}
  .warnbox{background:#fff4e0;color:#a35d00;border-radius:6px;padding:6px 8px;font-size:12px;margin:8px 12px 0}
  details.sec{border-bottom:1px solid var(--bd)}
  details.sec>summary{padding:9px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  details.sec>summary::after{content:"▾";color:var(--sub)}
  details.sec:not([open])>summary::after{content:"▸"}
  .sb{padding:2px 12px 12px}
  .row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px;margin-bottom:7px}
  .row>label{color:var(--sub);font-size:12px}
  .nr{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center}
  input[type=range]{width:100%;accent-color:var(--g)}
  input[type=number],input[type=text],textarea.tx{width:100%;border:1px solid var(--bd);border-radius:5px;padding:3px 6px;background:#fff;min-width:0}
  textarea.tx{min-height:54px;resize:vertical;font-size:12px}
  input:focus,textarea:focus{outline:0;border-color:var(--g)}
  .cr{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}
  .cr input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--bd);border-radius:5px;background:#fff}
  .sw{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px 70px}
  .sw button{width:18px;height:18px;border-radius:50%;border:1px solid #ccc;cursor:pointer;padding:0}
  .sw button:hover{outline:2px solid var(--g)}
  .bx{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:4px;align-items:center;text-align:center;margin:4px 0}
  .bx .mi{grid-column:auto}
  .bx .lb{font-size:11px;color:var(--sub)}
  .mg{background:#fdf1e3;border-radius:6px;padding:4px}
  .pd{background:#e3f4e8;border-radius:5px;padding:4px;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:3px;align-items:center}
  .mi{width:100%;min-width:0;border:1px solid var(--bd);border-radius:4px;padding:2px 3px;text-align:center;font-size:12px;background:#fff}
  .mi.act{border-color:var(--g);box-shadow:0 0 0 2px rgba(7,193,96,.25);font-weight:600}
  .car{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .car button,.carn button{border:1px solid var(--bd);background:#fff;border-radius:5px;cursor:pointer;min-width:30px;padding:3px 8px}
  .car button:hover,.carn button:hover{border-color:var(--g);color:var(--g)}
  .carn{display:flex;flex-wrap:wrap;gap:4px}
  .carn button.on{background:var(--g);border-color:var(--g);color:#fff}
  .imgi{border:1px solid var(--bd);border-radius:6px;padding:6px;margin-bottom:6px;display:grid;gap:5px}
  .imgh{display:flex;gap:8px;align-items:center}
  .imgh img{width:46px;height:46px;object-fit:cover;border-radius:4px;background:#f0f0f0;flex:none}
  .imgh b{font-size:12px;display:block}
  .lnk{border:0;background:none;color:var(--g);cursor:pointer;padding:0;font-size:12px}
  .mpctl{margin:8px 0 2px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:#fafafa;display:grid;gap:6px}
  .mpt{font-size:12px;color:var(--sub)}
  .mpt b{color:var(--g)}
  .mplink{width:max-content}
  #svgEdit{position:absolute;z-index:6;border:2px solid #ff9f1a;border-radius:4px;padding:0 6px;background:#fffdf7;box-shadow:0 2px 10px rgba(0,0,0,.15);outline:0}
  .mi:focus{outline:0;border-color:var(--g)}
  .tx-center{grid-column:2;grid-row:auto}
  .tree-row{display:flex;align-items:center;gap:5px;padding:3px 6px;cursor:pointer;border-bottom:1px solid #f3f3f3;font-size:12px}
  .tree-row .tw{width:14px;flex:none;text-align:center;color:var(--sub);border-radius:3px}
  .tree-row .tw:hover{background:#e3f4e8;color:var(--g)}
  .tree-row.anc .tg{background:#e3f4e8;color:var(--g)}
  .tree-row:hover{background:#f4fbf6}
  .tree-row.on{background:#c9efd9;box-shadow:inset 3px 0 0 var(--g);font-weight:600}
  .tree-row.off .lb{text-decoration:line-through;color:var(--sub)}
  .tree-row .tg{font:11px Consolas,monospace;color:#7a6a58;background:var(--bg);border-radius:3px;padding:0 4px;flex:none}
  .tree-row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-row .kn{flex:none;font-size:11px;color:#aaa;min-width:14px;text-align:right}
  .tree-row .eye{border:0;background:transparent;cursor:pointer;padding:0 2px}
  .empty{padding:24px 16px;color:var(--sub);text-align:center;line-height:1.9}
  footer{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#fff;border-top:1px solid var(--bd);color:var(--sub);font-size:12px}
  #toast{position:fixed;left:16px;bottom:40px;transform:none;background:rgba(0,0,0,.78);color:#fff;padding:7px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  #toast.show{opacity:1}
  #bXm.on{background:#fff4e0;border-color:#ff9f1a;color:#a35d00}
  #xmBox{flex:none;max-height:42%;overflow:auto;border-bottom:1px solid var(--bd);background:#fffaf2}
  .xmh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;position:sticky;top:0;z-index:1;background:#fff4e0;font-size:12px}
  .xmh b{color:#a35d00}
  .xmh button,.xmi button{border:1px solid #ffc46b;background:#fff;border-radius:4px;font-size:11px;padding:1px 7px;cursor:pointer;color:#a35d00}
  .xmh button:hover,.xmi button:hover{background:#ff9f1a;color:#fff}
  .xmi{display:flex;gap:6px;padding:4px 10px;font-size:12px;line-height:1.55;cursor:pointer;border-top:1px solid #f6ead5;align-items:flex-start}
  .xmi:hover{background:#fff0d6}
  .xmi .lv{flex:none}
  .xmi .ms{flex:1;min-width:0}
  .xmi .ms em{font:11px Consolas,monospace;font-style:normal;color:#7a6a58;background:#f3eadb;border-radius:3px;padding:0 4px;margin-right:4px}
  .xmok{padding:4px 10px 8px;color:var(--g);font-size:12px}
  .xmsel{margin:8px 12px 0;border:1px solid #ffc46b;border-radius:6px;background:#fffaf2;overflow:hidden}
  .xmsel .xmi:first-of-type{border-top:0}
  .xmsel .xmt{padding:5px 10px;background:#fff4e0;font-size:12px;font-weight:600;color:#a35d00}
  .xmbad{border-color:#e54545!important;background:#fff1f0!important}
  details.xmbad>summary{color:#e54545}
  #guides{position:absolute;inset:0;pointer-events:none;z-index:6}
  #guides .gl{position:absolute;background:#ff2d8a}
  #guides .gl.ins{background:var(--g);border-radius:2px}
  #drop{position:fixed;inset:0;background:rgba(7,193,96,.12);border:3px dashed var(--g);display:none;align-items:center;justify-content:center;font-size:20px;color:var(--g);z-index:8}
</style>
</head>
<body>
<header>
  <h1>✨ 推送可视化编辑器</h1>
  <div class="modes">
    <button id="mEdit" class="on" title="单击选中、双击改字、右侧改样式">✏️ 编辑</button>
    <button id="mPrev" title="所有互动效果按真实样子运行，可以点盒子">▶ 预览互动</button>
  </div>
  <button class="btn" id="bReset" title="把所有动画恢复到刚打开时的样子">↺ 动画复位</button>
  <button class="btn" id="bOpen">打开文件</button>
  <input type="file" id="file" accept=".html,.htm,.txt" hidden>
  <button class="btn" id="bUndo" title="Ctrl+Z">↶ 撤销</button>
  <button class="btn" id="bRedo" title="Ctrl+Y">↷ 重做</button>
  <button class="btn" id="bXm" title="按秀米导入规则检查：列出问题、点一下定位、能修的直接修；导出前自动修">🧵 秀米模式</button>
  <span class="sp"></span>
  <button class="btn" id="bSrc" title="展开/收起源码">{ } 源码</button>
  <button class="btn" id="bCopyCode">复制源码</button>
  <button class="btn" id="bCopyRich">复制排版</button>
  <button class="btn pri" id="bSave">下载 HTML</button>
</header>

<main>
  <section class="center">
    <div class="stagebar">
      <span class="seg" id="wseg">
        <button data-w="375" class="on">手机 375</button><button data-w="578">编辑器 578</button><button data-w="0">铺满</button>
      </span>
      <span id="hint"></span>
    </div>
    <div id="stageWrap">
      <div id="stage" style="width:375px"><iframe id="frame"></iframe><div id="ov"></div><div id="hov"></div><div id="guides"></div></div>
    </div>
    <div id="drawer" class="hidden"><textarea id="code" spellcheck="false"></textarea></div>
  </section>

  <aside class="side">
    <div class="col">
      <div class="colh">🗂 图层<span class="sp"></span><button id="bLocate" title="展开并滚到当前选中的元素">定位选中</button><button id="bFold" title="只保留选中元素所在的那一支">全部折叠</button></div>
      <div id="tree"></div>
    </div>
    <div class="col">
      <div class="colh">🎛 属性</div>
      <div id="xmBox" class="hidden"></div>
      <div id="panel"></div>
    </div>
  </aside>
</main>

<footer><span id="stInfo">就绪</span><span id="stSize"></span><span class="sp"></span><span>内容自动保存在本浏览器</span></footer>
<div id="toast"></div>
<div id="drop">松开即可打开文件</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const codeEl = $('#code'), frame = $('#frame'), stage = $('#stage'), wrapEl = $('#stageWrap');
const ov = $('#ov'), panel = $('#panel'), tree = $('#tree');
const LS_KEY = 'pushEditor.v2';
const SVG_NS = 'http://www.w3.org/2000/svg';
const MARK_ATTRS = ['data-ve-sel', 'data-ve-hide', 'data-ve-show', 'contenteditable'];
const PALETTE = ['#1f2329', '#ffffff', '#07c160', '#b5651d', '#e54545', '#1989fa', '#ff9f1a', '#8a5a33', '#f7f1e6', '#fffaf2'];
const SKIP_TREE = /^(script|style|link|meta|title|animate|animatetransform|animatemotion|set|tspan|defs|stop|clippath|mask|filter)$/i;
const NUM_ATTRS = ['x', 'y', 'width', 'height', 'rx', 'ry', 'cx', 'cy', 'r', 'x1', 'y1', 'x2', 'y2'];

const SAMPLE = `<section style="padding:20px 16px;background:#fffaf2;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
  <h2 style="margin:0 0 12px;font-size:22px;color:#b5651d;text-align:center;letter-spacing:2px;">秋日盲盒实验</h2>
  <p style="margin:0 0 16px;font-size:15px;line-height:1.9;color:#444;text-indent:2em;">单击选中元素，右侧调样式；双击文字直接改。切换到「预览互动」，盲盒就能真的点开。</p>
  <svg viewBox="0 0 1080 460" style="display:block;width:100%;">
    <g>
      <g>
        <rect x="330" y="120" width="420" height="260" rx="30" fill="#fff8e6" stroke="#8a5a33" stroke-width="6"></rect>
        <text x="540" y="240" text-anchor="middle" font-size="52" fill="#8a4b22" font-weight="bold"><tspan leaf="">🌲 松果</tspan></text>
        <text x="540" y="310" text-anchor="middle" font-size="34" fill="#d9442b" font-weight="bold"><tspan leaf="">不是真正的果实！</tspan></text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="click" values="0 0;0 -420" dur="0.6s" fill="freeze" restart="never"></animateTransform>
        <rect x="320" y="110" width="440" height="280" rx="34" fill="#b5651d"></rect>
        <text x="540" y="262" text-anchor="middle" font-size="46" fill="#ffffff" font-weight="bold"><tspan leaf="">🎁 点我拆开</tspan></text>
      </g>
    </g>
  </svg>
</section>`;

/* ================= 状态 ================= */
let mode = 'edit', wrap = {pre: '', post: ''}, doc = null;
let sel = null, editing = null, pending = null, previewPath = null;
let hist = [], hi = -1, hTimer = 0, rTimer = 0;
let hidden = new Set(), shown = new Set();
let xm = localStorage.getItem('pushEditor.xm') === '1', xmList = [], xmT = 0;   // 秀米模式

/* ================= 工具函数 ================= */
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const isSvgNode = el => el && el.namespaceURI === SVG_NS;
const isTextEl = el => el && (el.tagName.toLowerCase() === 'text' || (isSvgNode(el) === false && el.children.length === 0 && el.textContent.trim() !== '' && !/^(img|br|hr|svg|video|iframe|input)$/i.test(el.tagName)));
/* 段落里只有文字和加粗/斜体/span 这类行内标签，就算「可整段编辑的文字块」 */
const INLINE = /^(b|strong|i|em|u|s|span|a|font|small|big|sub|sup|mark|code|del|ins|br|label|abbr|q|cite)$/i;
function isRichBlock(el){
  if (!el || isSvgNode(el) || /^(img|br|hr|svg|video|iframe|input|table|tbody|thead|tr|ul|ol|body|html)$/i.test(el.tagName)) return false;
  if (!el.textContent.trim()) return false;
  return [...el.querySelectorAll('*')].every(n => INLINE.test(n.tagName));
}
/* 点在加粗字上时，编辑的是它所在的整段 */
function editTarget(el){
  let best = null;
  for (let p = el; p && p !== doc.body; p = p.parentElement){ if (isRichBlock(p)) best = p; else break; }
  return best;
}
const isBoxGroup = el => isSvgNode(el) && el.tagName.toLowerCase() === 'g';
function splitDoc(src){
  const m = src.match(/<body[^>]*>/i), e = src.search(/<\/body\s*>/i);
  if (m && e > m.index) return {pre: src.slice(0, m.index + m[0].length), body: src.slice(m.index + m[0].length, e), post: src.slice(e)};
  return {pre: '', body: src, post: ''};
}
function toHex(v){
  if (!v) return '#000000';
  if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
  if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + [...v.slice(1)].map(c => c + c).join('').toLowerCase();
  const m = v.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
  return m ? '#' + m.slice(1, 4).map(n => (+n).toString(16).padStart(2, '0')).join('') : '#000000';
}
function pathOf(el){ const p = []; while (el && el !== doc.body){ p.unshift([...el.parentNode.children].indexOf(el)); el = el.parentNode; } return p; }
function byPath(p){
  if (!p || !p.length) return null;
  let el = doc.body;
  for (const i of p){ el = el && el.children[i]; }
  return el || null;
}
function pick(t){
  if (!t || t === doc.body || t === doc.documentElement) return null;
  if (t.closest && isSvgNode(t) && t.closest('text')) return t.closest('text');
  return t;
}

/* ================= 渲染 / 同步 ================= */
function render(src, keepPath){
  const p = splitDoc(src);
  wrap = {pre: p.pre, post: p.post};
  const hook = '<script data-ve-hook>document.addEventListener("DOMContentLoaded",function(){parent.__veReady&&parent.__veReady(document)});<\/script>';
  const ref = '<meta name="referrer" content="no-referrer">';   // 微信图床防盗链：不带来源才显示原图
  const html = p.pre
    ? (/<\/head>/i.test(p.pre) ? p.pre.replace(/<\/head>/i, ref + '</head>') : p.pre) + hook + p.body + p.post
    : '<!DOCTYPE html><html><head><meta charset="utf-8">' + ref + '<meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">' + hook + p.body + '</body></html>';
  pending = keepPath || null;
  hidden = new Set(); shown = new Set(); frozen = false;
  frame.srcdoc = html;
  $('#stSize').textContent = (src.length / 1024).toFixed(1) + ' KB';
}
window.__veReady = d => {
  if (d !== frame.contentDocument) return;   // 忽略旧页面的回调
  doc = d;
  const st = doc.createElement('style');
  st.id = '__ve_style';

function fitFrame(){ if (doc) frame.style.height = Math.max(560, doc.documentElement.scrollHeight) + 'px'; }

function serialize(){

/* 每次改动后同步源码、历史、浮框 */
function changed(structural){

  codeEl.value = serialize();
  save();
  if (structural){ pushHist(codeEl.value); drawPanel(); drawTree(); }
  else { clearTimeout(hTimer); hTimer = setTimeout(() => pushHist(codeEl.value), 400); }
  placeOv(); fitFrame();
  $('#stSize').textContent = (codeEl.value.length / 1024).toFixed(1) + ' KB';

/* ================= 选中 / 编辑 ================= */
function onDocClick(e){

  if (editing && editing.contains(e.target)) return;
  e.preventDefault(); e.stopPropagation();
  if (dragEnded && Date.now() - dragEnded < 600){ dragEnded = 0; return; }   // 刚拖完松手产生的点击，不算
  if (editing) finishEdit();
  const t = pick(visibleTarget(e));

/* 跳过动画后已经透明的层（如淡出的盖子），选中真正看得见的元素 */

}

}
function onDblClick(e){

function select(el){

let editNbsp = 0;
function startEdit(el, x, y){

  el.addEventListener('input', onEditInput);

}
function onEditBlur(e){ if (e.currentTarget === editing) finishEdit(); }
function onEditInput(){ codeEl.value = serialize(); placeOv(); fitFrame(); }
/* 回车 = 拆成两段（按秀米规则不用 <br>/<div>）；Esc / Ctrl+Enter = 结束编辑 */

let svgEd = null;

/* 浮框：不靠 outline（SVG 不稳定），用绝对定位的框 */

/* ================= 隐藏 / 打开盲盒（只在编辑器里生效，导出不带） ================= */
function setHide(el, on){

}
function setShow(el, on){

  else { shown.delete(el); el.removeAttribute('data-ve-show'); }
}
function applyMarks(){
  hidden.forEach(el => { if (el.isConnected) el.setAttribute('data-ve-hide', ''); });

function applyPreviewState(on){

  if (on && sel){ sel.removeAttribute('data-ve-sel'); sel = null; }
}
function openCovers(){
  if (!sel) return toast('先在预览或图层里选中盒子里的内容');
  const root = sel.ownerSVGElement;
  if (!root) return toast('这个元素不在 SVG 盲盒里');
  const sr = sel.getBoundingClientRect(), area = sr.width * sr.height;
  let n = 0;
  root.querySelectorAll('*').forEach(c => {
    if (c === sel || c.contains(sel) || sel.contains(c) || hidden.has(c)) return;
    const trig = [...c.children].some(a => /^animate/i.test(a.tagName) && /click/.test(a.getAttribute('begin') || ''));
    if (!trig) return;

  });

    const op = p.getAttribute('opacity') === '0' || /opacity:\s*0(?![.\d])/.test(p.getAttribute('style') || '');
    if (op && !shown.has(p)){ setShow(p, true); n++; }
  }

  placeOv(); drawTree(); drawPanel();
}
function closeCovers(){
  hidden.forEach(el => el.removeAttribute('data-ve-hide'));
  shown.forEach(el => el.removeAttribute('data-ve-show'));
  hidden = new Set(); shown = new Set();
  toast('已全部关上'); placeOv(); drawTree(); drawPanel();
}

/* ================= 模式切换 ================= */
function setMode(m){
  if (m === mode || !doc) return;
  if (editing) finishEdit();
  if (m === 'edit'){
    // 从预览回编辑：定格在当前画面（动画暂停），直接改眼前看到的内容
    mode = 'edit'; $('#mEdit').classList.add('on'); $('#mPrev').classList.remove('on');
    freeze(true); applyMarks();
    placeOv(); drawPanel(); drawTree(); updateHint();
    return;
  }
  previewPath = sel ? pathOf(sel) : null;
  mode = m;
  freeze(false);

/* 定格：暂停所有 SVG 动画和 CSS 动画，画面停在当前样子；只影响编辑器显示，不改源码 */
let frozen = false;
function freeze(on){
  if (!doc) return;
  frozen = on;
  doc.querySelectorAll('svg').forEach(s => { if (!s.ownerSVGElement){ try { on ? s.pauseAnimations() : s.unpauseAnimations(); } catch(e){} } });
  let st = doc.getElementById('__ve_freeze');
  if (on && !st){ st = doc.createElement('style'); st.id = '__ve_freeze'; st.textContent = '*,*::before,*::after{animation-play-state:paused!important}'; doc.head.appendChild(st); }

function resetAnim(){
  if (editing) finishEdit();
  render(codeEl.value, sel ? pathOf(sel) : null);
  toast('动画已复位到初始画面');

/* ================= 轮播图 ================= */
const outerSvg = el => { let s = el && el.closest && el.closest('svg'); while (s && s.parentElement && s.parentElement.closest('svg')) s = s.parentElement.closest('svg'); return s; };

function findCarousel(svg){
  if (!svg) return null;

    if (a.getAttribute('repeatCount') !== 'indefinite' || /click/.test(a.getAttribute('begin') || '')) continue;
    const vals = (a.getAttribute('values') || '').split(';').map(s => s.trim()).filter(Boolean);
    if (vals.length < 3) continue;
    const kt = (a.getAttribute('keyTimes') || '').split(';').map(Number);
    const k = kt.length === vals.length ? kt : vals.map((_, i) => i / (vals.length - 1));
    const groups = [];
    for (let i = 0; i < vals.length; ){ let j = i; while (j + 1 < vals.length && vals[j + 1] === vals[i]) j++; groups.push({v: vals[i], i0: i, i1: j, mid: (k[i] + k[j]) / 2}); i = j + 1; }
    const holds = groups.filter(g => g.i1 > g.i0);
    if (holds.length < 2) continue;
    return {svg, anim: a, slides: holds, dur: secs(a.getAttribute('dur')), begin: secs(a.getAttribute('begin'))};

}
function curSlide(c){

  let best = 0, d = 9;
  c.slides.forEach((g, i) => { const x = Math.abs(f - g.mid); if (x < d){ d = x; best = i; } });
  return best;
}
function gotoSlide(c, i){
  i = (i + c.slides.length) % c.slides.length;

  c.svg.setCurrentTime(c.begin + c.slides[i].mid * c.dur);

    '<div class="carn">' + c.slides.map((_, i) => '<button data-car="' + i + '" class="' + (i === cur ? 'on' : '') + '">' + (i + 1) + '</button>').join('') + '</div>' +
    '<div class="note">编辑时轮播是停住的。翻到哪一张，左边就停在哪一张，点图就能换它；下面「图片」里也列出了全部轮播图。导出不受影响。</div>', true);
}
function updateHint(){

    ? (frozen

      : '<b>编辑模式</b>：动画已暂停。单击选中，按住拖动可移动（自动吸附对齐），双击（或再点一次）直接改字；轮播图在右侧翻页；想改点开后的内容，先去「预览互动」点开，再切回编辑')

/* ================= 图层树 ================= */
let opened = new WeakSet();          // 展开的节点
const treeKids = c => [...c.children].filter(x => !SKIP_TREE.test(x.tagName));
function expandTo(el){ for (let p = el && el.parentElement; p && p !== doc.body; p = p.parentElement) opened.add(p); }
function drawTree(){
  if (!doc){ tree.innerHTML = ''; return; }
  if (sel) expandTo(sel);
  const anc = new Set(); for (let p = sel && sel.parentElement; p && p !== doc.body; p = p.parentElement) anc.add(p);
  let h = '';
  const walk = (node, depth) => {
    treeKids(node).forEach(c => {
      const tg = c.tagName.toLowerCase();
      const path = pathOf(c).join('.');
      const kids = treeKids(c).length, isOpen = opened.has(c);
      const cls = (c === sel ? ' on' : '') + (anc.has(c) ? ' anc' : '') + (hidden.has(c) ? ' off' : '');
      h += '<div class="tree-row' + cls + '" style="padding-left:' + (4 + depth * 14) + 'px" data-path="' + path + '">' +
           '<span class="tw"' + (kids ? ' data-tw="' + path + '" title="展开/收起"' : '') + '>' + (kids ? (isOpen ? '▾' : '▸') : '') + '</span>' +
           '<span class="tg">' + esc(tg) + '</span><span class="lb" title="' + esc(labelOf(c)) + '">' + esc(labelOf(c)) + '</span>' + (kids ? '<span class="kn">' + kids + '</span>' : '') +
           '<button class="eye" data-eye="' + path + '" title="编辑器里隐藏/显示">' + (hidden.has(c) ? '🙈' : '👁') + '</button></div>';

/* 只在看不见时才滚动，滚到中间 */

  const r = el.getBoundingClientRect(); if (!r.width && !r.height){ hv.style.display = 'none'; return; }
  const fr = frame.getBoundingClientRect(), s = stage.getBoundingClientRect();
  Object.assign(hv.style, {display: 'block', left: (fr.left - s.left + r.left) + 'px', top: (fr.top - s.top + r.top) + 'px', width: r.width + 'px', height: r.height + 'px'});
}
tree.addEventListener('mouseover', e => { const row = e.target.closest('[data-path]'); placeHov(row && doc ? byPath(row.dataset.path.split('.').map(Number)) : null); });
tree.addEventListener('mouseleave', () => placeHov(null));

addEventListener('dragleave', () => { if (--dragN <= 0){ dragN = 0; $('#drop').style.display = 'none'; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').style.display = 'none'; const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(t, f.name)); });

$('#mEdit').onclick = () => setMode('edit');
$('#mPrev').onclick = () => setMode('preview');
$('#bReset').onclick = resetAnim;
$('#bUndo').onclick = () => go(-1);
$('#bRedo').onclick = () => go(1);
$('#bSrc').onclick = () => $('#drawer').classList.toggle('hidden');
$('#wseg').onclick = e => {
  const w = e.target.dataset.w; if (w === undefined) return;
  document.querySelectorAll('#wseg button').forEach(b => b.classList.toggle('on', b === e.target));
  stage.style.width = +w ? w + 'px' : '100%';
  const c = $('.center'); c.classList.toggle('full', !+w); c.style.width = +w ? (+w + 64) + 'px' : '';
  setTimeout(() => { fitFrame(); placeOv(); }, 50);
};
$('#bLocate').onclick = () => { if (!sel) return toast('还没有选中元素'); drawTree(); const on = tree.querySelector('.tree-row.on'); if (on) tree.scrollTop += on.getBoundingClientRect().top - tree.getBoundingClientRect().top - tree.clientHeight / 2; scrollStageTo(sel); };
$('#bFold').onclick = () => { opened = new WeakSet(); drawTree(); tree.scrollTop = 0; toast(sel ? '已折叠，只展开选中元素所在的一支' : '已全部折叠'); };
$('#bCopyCode').onclick = () => {
  if (!xmBeforeExport()) return;
  const text = codeEl.value;
  navigator.clipboard.writeText(text).then(() => toast('源码已复制'), () => { codeEl.select(); document.execCommand('copy'); toast('源码已复制'); });
};
$('#bCopyRich').onclick = async () => {
  if (!xmBeforeExport()) return;
  const body = splitDoc(codeEl.value).body;
  try {
    await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([body], {type: 'text/html'}), 'text/plain': new Blob([body], {type: 'text/plain'})})]);
    toast('排版已复制，可直接粘贴到公众号编辑器');
  } catch (err){ toast('浏览器不允许富文本复制，请用「复制源码」'); }
};
$('#bSave').onclick = () => {
  if (!xmBeforeExport()) return;
  const blob = new Blob([codeEl.value], {type: 'text/html;charset=utf-8'});
  const a = document.createElement('a'), d = new Date(), p = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = '推送-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + (xm ? '_xiumi' : '') + '.html';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已下载');
};

/* ================= 杂项 ================= */
function save(){ try { localStorage.setItem(LS_KEY, codeEl.value); } catch (e){} }
let toastT;
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
  $('#stInfo').textContent = t + '  ' + new Date().toLocaleTimeString();
}

/* 启动 */
const init = localStorage.getItem(LS_KEY) || SAMPLE;
codeEl.value = init; hist = []; pushHist(init); updBtns();
render(init);
updateHint();
})();
</script>
</body>
</html>
