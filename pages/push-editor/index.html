<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>推送可视化编辑器</title>
<style>
  :root{--g:#07c160;--bd:#e3e5e8;--bg:#f2f3f5;--tx:#1f2329;--sub:#8a9099;--warn:#ff9f1a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
  button,select,input,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  header{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--bd)}
  header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
  .sp{flex:1}
  .btn{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--g);color:var(--g)}
  .btn.pri{background:var(--g);border-color:var(--g);color:#fff}
  .btn.pri:hover{color:#fff;filter:brightness(1.05)}
  .btn.danger:hover{border-color:#e54545;color:#e54545}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{font-size:12px;padding:4px 8px;color:#555}
  .modes{display:inline-flex;border:1px solid var(--g);border-radius:8px;overflow:hidden}
  .modes button{border:0;background:#fff;padding:5px 12px;cursor:pointer;color:var(--g)}
  .modes button.on{background:var(--g);color:#fff}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;background:#fff;padding:3px 9px;cursor:pointer;font-size:12px}
  .seg button+button{border-left:1px solid var(--bd)}
  .seg button.on{background:var(--g);color:#fff}
  main{display:flex;height:calc(100% - 48px - 26px)}
  .center{flex:none;width:440px;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--bd)}
  .center.full{flex:1;width:auto}
  .stagebar{min-height:38px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px 10px;background:#fff;border-bottom:1px solid var(--bd)}
  #hint{color:var(--sub);font-size:12px;line-height:1.5}
  #hov{position:absolute;display:none;pointer-events:none;border:1px dashed #1989fa;background:rgba(25,137,250,.08);z-index:4}
  #hint b{color:var(--g)}
  #stageWrap{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;background:#e9ebee;min-height:0}
  #stage{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:4px;height:max-content;flex:none;max-width:100%}
  #frame{width:100%;border:0;display:block;min-height:560px}
  #ov{position:absolute;display:none;pointer-events:none;border:2px solid var(--g);background:rgba(7,193,96,.08);z-index:5;border-radius:3px}
  #ov::after{content:attr(data-tag);position:absolute;left:-2px;top:-20px;background:var(--g);color:#fff;font-size:11px;padding:0 5px;border-radius:3px 3px 0 0;white-space:nowrap}
  #drawer{height:150px;border-top:1px solid var(--bd);background:#1e1f22}
  #drawer textarea{width:100%;height:100%;border:0;outline:0;resize:none;padding:8px 10px;font:12px/18px Consolas,monospace;background:#1e1f22;color:#d6d6d6;white-space:pre;tab-size:2}
  .side{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.15fr);background:#fff}
  .center.full+.side{flex:none;width:640px}
  .col{display:flex;flex-direction:column;min-width:0;min-height:0}
  .col+.col{border-left:1px solid var(--bd)}
  .colh{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--bd);font-weight:600;color:var(--tx)}
  .colh .sp{flex:1}
  .colh button{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:1px 7px;cursor:pointer;font-size:12px;font-weight:400}
  .colh button:hover{border-color:var(--g);color:var(--g)}
  #panel,#tree{flex:1;overflow:auto;min-height:0}
  .card{padding:10px 12px;border-bottom:1px solid var(--bd)}
  .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:6px}
  .crumb i{color:#bbb;font-style:normal}
  .crumb .lbl{color:var(--sub);font-size:12px;margin-right:2px;cursor:default;background:none;padding:0}
  .crumb span{padding:0 6px;border-radius:4px;background:var(--bg);font:12px Consolas,monospace;cursor:pointer}
  .crumb span:not(.lbl):hover{outline:1px solid var(--g)}
  .crumb span.cur{background:var(--g);color:#fff}
  .crumb.kids span em{font:11px sans-serif;color:var(--sub);font-style:normal}
  .tools{display:flex;flex-wrap:wrap;gap:5px}
  .tools button{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px}
  .tools button:hover{border-color:var(--g);color:var(--g)}
  .tools button.danger:hover{border-color:#e54545;color:#e54545}
  .note{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.6}
  .warnbox{background:#fff4e0;color:#a35d00;border-radius:6px;padding:6px 8px;font-size:12px;margin:8px 12px 0}
  details.sec{border-bottom:1px solid var(--bd)}
  details.sec>summary{padding:9px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  details.sec>summary::after{content:"▾";color:var(--sub)}
  details.sec:not([open])>summary::after{content:"▸"}
  .sb{padding:2px 12px 12px}
  .row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px;margin-bottom:7px}
  .row>label{color:var(--sub);font-size:12px}
  .nr{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center}
  input[type=range]{width:100%;accent-color:var(--g)}
  input[type=number],input[type=text],textarea.tx{width:100%;border:1px solid var(--bd);border-radius:5px;padding:3px 6px;background:#fff;min-width:0}
  textarea.tx{min-height:54px;resize:vertical;font-size:12px}
  input:focus,textarea:focus{outline:0;border-color:var(--g)}
  .cr{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}
  .cr input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--bd);border-radius:5px;background:#fff}
  .sw{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px 70px}
  .sw button{width:18px;height:18px;border-radius:50%;border:1px solid #ccc;cursor:pointer;padding:0}
  .sw button:hover{outline:2px solid var(--g)}
  .bx{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:4px;align-items:center;text-align:center;margin:4px 0}
  .bx .mi{grid-column:auto}
  .bx .lb{font-size:11px;color:var(--sub)}
  .mg{background:#fdf1e3;border-radius:6px;padding:4px}
  .pd{background:#e3f4e8;border-radius:5px;padding:4px;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:3px;align-items:center}
  .mi{width:100%;min-width:0;border:1px solid var(--bd);border-radius:4px;padding:2px 3px;text-align:center;font-size:12px;background:#fff}
  .mi.act{border-color:var(--g);box-shadow:0 0 0 2px rgba(7,193,96,.25);font-weight:600}
  .car{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .car button,.carn button{border:1px solid var(--bd);background:#fff;border-radius:5px;cursor:pointer;min-width:30px;padding:3px 8px}
  .car button:hover,.carn button:hover{border-color:var(--g);color:var(--g)}
  .carn{display:flex;flex-wrap:wrap;gap:4px}
  .carn button.on{background:var(--g);border-color:var(--g);color:#fff}
  .imgi{border:1px solid var(--bd);border-radius:6px;padding:6px;margin-bottom:6px;display:grid;gap:5px}
  .imgh{display:flex;gap:8px;align-items:center}
  .imgh img{width:46px;height:46px;object-fit:cover;border-radius:4px;background:#f0f0f0;flex:none}
  .imgh b{font-size:12px;display:block}
  .lnk{border:0;background:none;color:var(--g);cursor:pointer;padding:0;font-size:12px}
  .mpctl{margin:8px 0 2px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:#fafafa;display:grid;gap:6px}
  .mpt{font-size:12px;color:var(--sub)}
  .mpt b{color:var(--g)}
  .mplink{width:max-content}
  #svgEdit{position:absolute;z-index:6;border:2px solid #ff9f1a;border-radius:4px;padding:0 6px;background:#fffdf7;box-shadow:0 2px 10px rgba(0,0,0,.15);outline:0}
  .mi:focus{outline:0;border-color:var(--g)}
  .tx-center{grid-column:2;grid-row:auto}
  .tree-row{display:flex;align-items:center;gap:5px;padding:3px 6px;cursor:pointer;border-bottom:1px solid #f3f3f3;font-size:12px}
  .tree-row .tw{width:14px;flex:none;text-align:center;color:var(--sub);border-radius:3px}
  .tree-row .tw:hover{background:#e3f4e8;color:var(--g)}
  .tree-row.anc .tg{background:#e3f4e8;color:var(--g)}
  .tree-row:hover{background:#f4fbf6}
  .tree-row.on{background:#c9efd9;box-shadow:inset 3px 0 0 var(--g);font-weight:600}
  .tree-row.off .lb{text-decoration:line-through;color:var(--sub)}
  .tree-row .tg{font:11px Consolas,monospace;color:#7a6a58;background:var(--bg);border-radius:3px;padding:0 4px;flex:none}
  .tree-row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-row .kn{flex:none;font-size:11px;color:#aaa;min-width:14px;text-align:right}
  .tree-row .eye{border:0;background:transparent;cursor:pointer;padding:0 2px}
  .empty{padding:24px 16px;color:var(--sub);text-align:center;line-height:1.9}
  footer{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#fff;border-top:1px solid var(--bd);color:var(--sub);font-size:12px}
  #toast{position:fixed;left:16px;bottom:40px;transform:none;background:rgba(0,0,0,.78);color:#fff;padding:7px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  #toast.show{opacity:1}
  #bXm.on{background:#fff4e0;border-color:#ff9f1a;color:#a35d00}
  #xmBox{flex:none;max-height:42%;overflow:auto;border-bottom:1px solid var(--bd);background:#fffaf2}
  .xmh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;position:sticky;top:0;z-index:1;background:#fff4e0;font-size:12px}
  .xmh b{color:#a35d00}
  .xmh button,.xmi button{border:1px solid #ffc46b;background:#fff;border-radius:4px;font-size:11px;padding:1px 7px;cursor:pointer;color:#a35d00}
  .xmh button:hover,.xmi button:hover{background:#ff9f1a;color:#fff}
  .xmi{display:flex;gap:6px;padding:4px 10px;font-size:12px;line-height:1.55;cursor:pointer;border-top:1px solid #f6ead5;align-items:flex-start}
  .xmi:hover{background:#fff0d6}
  .xmi .lv{flex:none}
  .xmi .ms{flex:1;min-width:0}
  .xmi .ms em{font:11px Consolas,monospace;font-style:normal;color:#7a6a58;background:#f3eadb;border-radius:3px;padding:0 4px;margin-right:4px}
  .xmok{padding:4px 10px 8px;color:var(--g);font-size:12px}
  .xmsel{margin:8px 12px 0;border:1px solid #ffc46b;border-radius:6px;background:#fffaf2;overflow:hidden}
  .xmsel .xmi:first-of-type{border-top:0}
  .xmsel .xmt{padding:5px 10px;background:#fff4e0;font-size:12px;font-weight:600;color:#a35d00}
  .xmbad{border-color:#e54545!important;background:#fff1f0!important}
  details.xmbad>summary{color:#e54545}
  #guides{position:absolute;inset:0;pointer-events:none;z-index:6}
  #guides .gl{position:absolute;background:#ff2d8a}
  #guides .gl.ins{background:var(--g);border-radius:2px}
  .mbox{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:30} .mbox.hidden{display:none} .mbox .fd{background:#fff;border-radius:10px;width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:auto} .mbox .ft{padding:14px 16px 4px;font-weight:bold} .mbox .fs{padding:0 16px 8px;color:#4e5560;font-size:13px;line-height:1.7} .mbox .fs small{color:var(--sub)} .mbox .fb{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px} .mbox .fb:empty{padding:6px} .mform{padding:0 16px;display:flex;flex-direction:column;gap:10px} .mform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)} .mform input,.mform textarea{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--tx);font-size:13px;resize:vertical} .mcov{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--sub)} .mcov .ml{flex:none;padding-top:4px} .mcov .cv{width:188px;height:80px;border-radius:6px;border:1px dashed var(--bd);background:#f7f8fa center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center} .mcb{display:flex;flex-direction:column;gap:6px;flex:1} .mcb small{font-size:11px} #bMeta.on{border-color:var(--g);color:var(--g2);font-weight:600} .menu button.off{opacity:.5} #fillBox{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}
  #fillBox.hidden{display:none}
  #fillBox .fd{background:#fff;border-radius:10px;width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  #fillBox .ft{padding:14px 16px 4px;font-weight:bold}
  #fillBox .fs{padding:0 16px 8px;color:var(--sub);font-size:12px;line-height:1.6}
  #fillBox .fl{overflow:auto;margin:0 16px;border:1px solid var(--bd);border-radius:6px;font-size:12px}
  #fillBox .fr{display:flex;gap:8px;padding:5px 8px;border-top:1px solid var(--bd)}
  #fillBox .fr:first-child{border-top:0}
  #fillBox .fn{font-weight:bold;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #fillBox .fu{flex:1;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #fillBox .fc{flex:none;color:var(--sub)}
  #fillBox .fb{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
  #drop{position:fixed;inset:0;background:rgba(7,193,96,.12);border:3px dashed var(--g);display:none;align-items:center;justify-content:center;font-size:20px;color:var(--g);z-index:8}

  /* ===== 2026-10-30 界面整理：灰色=普通操作，绿色=主操作和选中，橙色=检查，红色=删除 ===== */
  :root{--g:#07c160;--g2:#06a552;--gl:#e8f8ef;--bd:#e3e5e8;--bg:#f4f5f7;--tx:#1f2329;--sub:#6b7280;--mute:#a0a6ae;--warn:#f08c00;--wl:#fff4e0;--red:#e54545;--hv:#f2f3f5}
  header{height:52px;gap:8px;padding:0 14px;box-shadow:0 1px 0 var(--bd)}
  header h1{font-size:15px;margin-right:4px;color:#111}
  .dv{width:1px;height:22px;background:var(--bd);margin:0 4px;flex:none}
  .btn{height:32px;display:inline-flex;align-items:center;gap:4px;padding:0 12px;border-radius:7px;border-color:#d9dce0;transition:background .12s,border-color .12s,color .12s}
  .btn:hover{border-color:#c4c8ce;color:var(--tx);background:var(--hv)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
  .btn.ghost:hover{background:var(--hv);color:var(--tx)}
  .btn.pri{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
  .btn.pri:hover{background:var(--g2);border-color:var(--g2);color:#fff;filter:none}
  .btn:disabled,.btn:disabled:hover{opacity:.35;background:#fff;border-color:#d9dce0;transform:none}
  .ibg{display:inline-flex}
  .ibg .btn.ic{width:34px;padding:0;justify-content:center;font-size:16px;border-radius:0}
  .ibg .btn.ic:first-child{border-radius:7px 0 0 7px}
  .ibg .btn.ic+.btn.ic{border-radius:0 7px 7px 0;margin-left:-1px}
  .modes{height:32px;border:1px solid #d9dce0;border-radius:8px;padding:2px;background:var(--bg);gap:2px}
  .modes button{border-radius:6px;color:var(--sub);padding:0 12px;background:transparent}
  .modes button:hover{color:var(--tx)}
  .modes button.on{background:#fff;color:var(--g2);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .btn.chk{color:#8a5300}
  .btn.chk:hover{background:var(--wl);border-color:#ffc46b;color:#8a5300}
  #bXm.on{background:var(--wl);border-color:var(--warn);color:#8a5300;font-weight:600}
  .badge{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;color:#fff;font-weight:600}
  .badge.err{display:inline-block;background:var(--red)}
  .badge.warn{display:inline-block;background:var(--warn)}
  .badge.ok{display:inline-block;background:var(--g)}
  .split{position:relative;display:inline-flex}
  .split #bSave{border-radius:7px 0 0 7px;padding:0 14px}
  .split .caret{border-radius:0 7px 7px 0;padding:0 8px;border-left:1px solid rgba(255,255,255,.35)}
  .split .caret.open{background:var(--g2)}
  .menu{position:absolute;right:0;top:38px;min-width:250px;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;z-index:20}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
  .menu button:hover{background:var(--gl)}
  .menu button b{display:block;font-weight:600}
  .menu button small{display:block;color:var(--sub);font-size:12px}
  main{height:calc(100% - 52px - 26px)}
  .stagebar{min-height:40px;gap:8px;padding:5px 10px}
  .seg{border-color:#d9dce0;border-radius:7px;background:var(--bg);padding:2px;gap:2px}
  .seg button{border-radius:5px;padding:3px 10px;background:transparent;color:var(--sub)}
  .seg button+button{border-left:0}
  .seg button.on{background:#fff;color:var(--g2);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sbtn{border:1px solid #d9dce0;background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font:12px Consolas,monospace;color:var(--sub)}
  .sbtn:hover{background:var(--hv);color:var(--tx)}
  .sbtn.on{background:#1e1f22;border-color:#1e1f22;color:#fff}
  #hint{padding:6px 12px;background:#fafbfc;border-bottom:1px solid var(--bd);color:var(--sub)}
  #hint b{color:var(--g2)}
  .colh{padding:8px 12px;background:#fafbfc;font-size:13px}
  .colh button{height:24px;border-color:#d9dce0;border-radius:6px;padding:0 8px;color:var(--sub)}
  .colh button:hover{border-color:#c4c8ce;color:var(--tx);background:var(--hv)}
  .card{padding:12px}
  .crumb span{background:var(--bg)}
  .crumb span:not(.lbl):hover{outline:1px solid var(--g);background:var(--gl)}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
  .acts button,.tools button{height:28px;border:1px solid #d9dce0;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts button:hover,.tools button:hover{border-color:#c4c8ce;background:var(--hv);color:var(--tx)}
  .acts button.danger{grid-column:4;color:var(--red);border-color:#f3c5c5}
  .acts button.danger:hover{background:#fff1f0;border-color:var(--red);color:var(--red)}
  .tools.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .note{color:var(--sub)}
  details.sec>summary{padding:10px 12px;font-size:13px;background:#fafbfc;user-select:none}
  details.sec>summary:hover{background:var(--hv)}
  details.sec[open]>summary{border-bottom:1px solid #eef0f2}
  .sb{padding:10px 12px 12px}
  .tree-row{padding-top:4px;padding-bottom:4px}
  .tree-row:hover{background:#f6f7f9}
  .tree-row.on{background:var(--gl);box-shadow:inset 3px 0 0 var(--g)}
  .tree-row .lb.dim{color:var(--mute);font-style:italic}
  .tree-row .eye{opacity:.35}
  .tree-row:hover .eye,.tree-row.off .eye{opacity:1}
  .empty{color:var(--sub)}
  .empty b{color:var(--g2)}
  footer{gap:16px}
  #stSaved{color:var(--g2)}
  #toast{left:50%;transform:translateX(-50%) translateY(6px);bottom:44px;padding:9px 18px;border-radius:20px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:opacity .2s,transform .2s;max-width:80vw;text-align:center}

const BG_RE = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
function imgList(root){
  const out = [];
  [root, ...root.querySelectorAll('*')].forEach(n => {
    const tg = n.tagName.toLowerCase();
    if (tg === 'img' && n.getAttribute('src')) out.push({el: n, kind: 'src', url: n.getAttribute('src'), label: '图片'});
    if (tg === 'image'){ const u = n.getAttribute('href') || n.getAttribute('xlink:href'); if (u) out.push({el: n, kind: 'href', url: u, label: 'SVG 图片'}); }

  for (let p = root.parentElement, d = 0; p && p !== doc.body && d < 8; p = p.parentElement, d++){
    const st = p.getAttribute('style') || '';
    if (/url\(/i.test(st)) for (const m of st.matchAll(BG_RE)) out.push({el: p, kind: 'bg', url: m[2], label: '上级的背景图（' + p.tagName.toLowerCase() + '）'});

      const label = i >= 0 ? '轮播第 ' + (i + 1) + ' 张' : (Math.abs(fx - lastOff) < 2 ? '第 1 张的衔接副本' : '轮播里的图');

    if (e.message === 'NO_EXT') return mpNoExt();
    if (/^没找到公众号文章编辑页/.test(e.message)){
      const v = await mpShow('没找到公众号编辑页', esc(e.message) + '<br><br>也可以先导出压缩包，发给相关负责人。', [{t: '导出压缩包', v: 1}, {t: '知道了', v: 0, pri: 1}]);
      if (v) doZip(false);
      return;
    }
    mpMsg('没发成功', esc(e.message));
  }
}

/* 从公众号读取 */
async function mpRead(){
  if (editing) finishEdit();
  if (!wxOn()) return mpNoExt();
  try {
    mpBusy('从公众号读取', '正在找公众号编辑页…');
    const tab = await mpPick();
    if (!tab){ mpBox.classList.add('hidden'); return; }
    const r = await wxCall('getContent', {tabId: tab.tabId});
    const content = (r.content || '').replace(/<p[^>]*display:\s*none[^>]*>\s*<mp-style-type[^>]*>\s*<\/mp-style-type>\s*<\/p>/gi, '');
    if (mpEmpty(content)) throw new Error('那个编辑页的正文是空的。');
    const before = splitDoc(codeEl.value).body;
    const go = await mpShow('读回来，替换编辑器内容？', '<b>' + esc(r.account || '') + '</b>「' + esc(r.title || '未命名') + '」<br>公众号里：' + mpStat(content) + '<br>编辑器里：' + mpStat(before) + '<br><br>读回后会替换编辑器当前内容，可以用 ↶ 撤销回来。标题、作者、摘要、封面也会读进「文章信息」。', [{t: '取消', v: 0}, {t: '读回来', v: 1, pri: 1}]);
    if (!go) return;
    const p = splitDoc(codeEl.value), text = p.pre ? p.pre + content + p.post : content;
    codeEl.value = text; pushHist(text); save(); render(text); updBtns();
    const m = getMeta();
    ['title', 'author', 'digest', 'cover'].forEach(k => { if (r[k]) m[k] = r[k]; });
    setMeta(m); metaBadge();
    toast('已从公众号读回（可撤销）');
  } catch (e){
    if (e.message === 'NO_EXT') return mpNoExt();
    mpMsg('没读成功', esc(e.message));
  }
}
$('#bMpSend').onclick = mpSend;
$('#bMpRead').onclick = mpRead;

/* 启动 */
const init = localStorage.getItem(LS_KEY) || SAMPLE;
codeEl.value = init; hist = []; pushHist(init); updBtns();
render(init);
updateHint();
})();
</script>
